<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Speed Assignment - Admin Login</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="noindex, nofollow" name="robots">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #081E36;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }

        .admin-login-card {
            width: 100%;
            max-width: 420px;
            background: #FFFFFF;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            padding: 2.5rem 2rem;
        }

        .admin-brand-icon {
            width: 40px;
            height: 40px;
            background-color: rgba(0, 185, 142, 0.1);
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .admin-brand-title {
            color: #081E36;
            font-weight: 800;
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .admin-subtitle {
            color: #6C757D;
            font-size: 0.875rem;
            margin-bottom: 1.75rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #081E36;
        }

        .form-control {
            border-radius: 2px;
            border: 1px solid rgba(14, 46, 80, 0.2);
            padding: 0.65rem 0.85rem;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: #00B98E;
            box-shadow: 0 0 0 0.2rem rgba(0, 185, 142, 0.15);
        }

        .btn-admin-submit {
            background-color: #00B98E;
            color: #FFFFFF;
            font-weight: 700;
            border-radius: 2px;
            padding: 0.75rem 1rem;
            border: none;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
        }

        .btn-admin-submit:hover,
        .btn-admin-submit:focus {
            background-color: #009673;
            color: #FFFFFF;
        }

        .btn-admin-submit:disabled {
            background-color: #6c757d;
            border-color: #6c757d;
            cursor: not-allowed;
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <div class="admin-login-card">
        <div class="text-center mb-4">
            <img src="img/logo.png" alt="Speed Assignment" style="height: 60px; width: auto; max-width: 100%;" class="mb-2">
            <p class="admin-subtitle">Internal Portal • Admin Login</p>
        </div>

        <form id="admin-login-form">
            <div class="mb-3">
                <label for="adminEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="adminEmail" placeholder="admin@speedassignment.com" required autocomplete="email">
            </div>

            <div class="mb-3">
                <label for="adminPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="adminPassword" placeholder="••••••••••••" required autocomplete="current-password">
            </div>

            <div id="admin-login-feedback" class="mb-3" style="display: none;"></div>

            <button type="submit" class="btn btn-admin-submit w-100" id="admin-submit-btn">Sign In</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // If valid token exists, redirect to admin.html
            var existingToken = localStorage.getItem('assignmentghar_admin_token');
            if (existingToken) {
                window.location.href = 'admin.html';
                return;
            }

            var loginForm = document.getElementById('admin-login-form');
            var feedbackDiv = document.getElementById('admin-login-feedback');
            var submitBtn = document.getElementById('admin-submit-btn');

            if (!loginForm) return;

            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                if (feedbackDiv) {
                    feedbackDiv.style.display = 'none';
                    feedbackDiv.innerHTML = '';
                }

                var emailInput = document.getElementById('adminEmail');
                var passwordInput = document.getElementById('adminPassword');

                var email = emailInput ? emailInput.value.trim() : '';
                var password = passwordInput ? passwordInput.value : '';

                if (!email || !password) {
                    showFeedback('Please enter both email and password.', 'danger');
                    return;
                }

                var originalBtnText = submitBtn ? submitBtn.innerHTML : 'Sign In';
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = 'Logging in...';
                }

                var defaultApiBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '0.0.0.0' || window.location.protocol === 'file:')
                    ? 'http://localhost:5001/api'
                    : '/api';
                var API_BASE = (window.ASSIGNMENTGHAR_API_URL || defaultApiBase).replace(/\/+$/, '');
                var API_URL = API_BASE + '/admin/login';

                try {
                    var response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    });

                    var contentType = response.headers.get('content-type') || '';
                    var result = contentType.includes('application/json') ? await response.json() : null;

                    if (response.status === 200 && result && result.success && result.data && result.data.token) {
                        localStorage.setItem('assignmentghar_admin_token', result.data.token);
                        if (result.data.admin) {
                            localStorage.setItem('assignmentghar_admin_user', JSON.stringify(result.data.admin));
                        }
                        window.location.href = 'admin.html';
                    } else if (response.status === 401) {
                        showFeedback('Invalid email or password.', 'danger');
                    } else {
                        var errorMsg = (result && result.message) || ('Login failed (Server status ' + response.status + ').');
                        showFeedback(errorMsg, 'danger');
                    }
                } catch (err) {
                    console.error('Admin login error:', err);
                    showFeedback('Unable to connect to the server. Please check your connection and try again.', 'danger');
                } finally {
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalBtnText;
                    }
                }
            });

            function showFeedback(message, type) {
                if (!feedbackDiv) return;
                var alertClass = type === 'success' ? 'alert alert-success py-2 px-3 mb-0' : 'alert alert-danger py-2 px-3 mb-0';
                feedbackDiv.innerHTML = '<div class="' + alertClass + '" style="border-radius: 2px; font-size: 0.875rem;" role="alert">' + escapeHtml(message) + '</div>';
                feedbackDiv.style.display = 'block';
            }

            function escapeHtml(text) {
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        });
    </script>
</body>

</html>
